name: build-and-push

# Builds the Track B detection engine image on a real Linux runner (no local
# virtualization needed) and pushes it to GHCR. The competition needs the image
# plus its sha256 digest -- both are printed in the run Summary.
# Runs automatically on push to main, or on demand via "Run workflow".
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read       # checkout the repo
  packages: write      # push the image to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: img
        # GHCR requires an all-lowercase path: ghcr.io/<owner>/<repo>
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, single clean digest)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false   # no attestation index -> one stable image digest
          sbom: false
          tags: |
            ${{ steps.img.outputs.name }}:1.0.0
            ${{ steps.img.outputs.name }}:latest

      - name: Publish digest to run summary
        run: |
          {
            echo "## Track B image pushed to GHCR"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| image_ref | \`${{ steps.img.outputs.name }}@${{ steps.build.outputs.digest }}\` |"
            echo "| image_digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| tag | \`${{ steps.img.outputs.name }}:1.0.0\` |"
            echo ""
            echo "> Then make the package **Public** in GitHub -> your profile -> Packages -> this package -> Package settings, so the graders can pull it offline-ingest."
          } >> "$GITHUB_STEP_SUMMARY"
